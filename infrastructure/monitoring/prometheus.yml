global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 1. Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Kafka Cluster Metrics (via Kafka Exporter)
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # 3. Redis In-Memory Metrics (via Redis Exporter)
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # 4. MinIO Object Storage Metrics
  - job_name: "minio"
    metrics_path: "/minio/v2/metrics/cluster"
    static_configs:
      - targets: ["minio:9000"]

  # 5. Real-Time FastAPI Serving Backend
  - job_name: "fastapi_realtime"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
